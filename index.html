<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="课程待办、阅读材料与 Final 考试时间。">
  <title>WorkList · 待办与 Final</title>
  <link rel="stylesheet" href="style.css?v=20261115-layout">
  <script defer src="data.js?v=20261118-noon"></script>
  <script defer src="app.js?v=20261115-layout"></script>
</head>
<body>
  <a class="skip" href="#tasks">跳到待办任务</a>
  <header class="mast"><a class="brand" href="./">WorkList</a><span><time id="current-date"></time> · 芝加哥时间</span></header>
  <main>
    <section id="tasks" aria-labelledby="task-heading">
      <div class="section-head"><h1 id="task-heading" tabindex="-1">待办任务</h1><span id="task-count"></span><a class="mobile-jump" href="#finals">Final 考试 ↓</a></div>
      <ul id="task-list" aria-label="按截止时间排序的待办任务"></ul>
      <div class="action-message" role="status"><span id="status-message"></span> <button type="button" id="undo" hidden>撤销</button></div>
    </section>
    <section id="finals" aria-labelledby="exam-heading">
      <div class="section-head"><h2 id="exam-heading">Final 考试</h2></div>
      <ul id="exam-list" aria-label="考试时间与地点"></ul>
    </section>
  </main>
  <noscript>请启用 JavaScript 查看任务和考试倒计时。</noscript>
</body>
</html>
