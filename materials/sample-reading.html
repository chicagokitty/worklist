<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>材料示例 · worklist</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#18181b;font:15px/1.9 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:730px;padding:45px 28px;margin:auto}a{color:#3f3f46;text-underline-offset:4px;font-size:13px}.kicker{font-size:11px;color:#71717a;margin:55px 0 10px}h1{font-size:30px;font-weight:600;line-height:1.5;margin:0 0 15px}h2{font-size:16px;font-weight:600;margin:28px 0 8px}p{color:#71717a;font-size:14px}.label{display:inline-block;padding:3px 9px;border:1px solid #e4e4e7;border-radius:4px;color:#71717a;font-size:11px}.sheet{border-top:1px solid #e4e4e7;margin-top:30px;padding-top:5px}li{font-size:13px;color:#71717a;margin:6px 0}.footer{border-top:1px solid #e4e4e7;margin-top:35px;padding-top:20px;font-size:11px;color:#8b8b95}a:focus-visible{outline:2px solid #18181b;outline-offset:5px}@media(max-width:500px){main{padding:28px 22px}h1{font-size:26px}}

<body><main><a href="../index.html">← 返回 worklist</a><p class="kicker">材料预览</p><h1 id="title">阅读材料</h1><span class="label">原创占位材料 · 非真实课程文件</span><p>这里演示点击任务旁的文件链接后，直接打开对应材料。</p><section class="sheet"><h2>正式材料将包含</h2><ul><li>材料名称、作者与版本</li><li>阅读范围或题目要求</li><li>原始来源与下载入口</li></ul><h2>文件入口</h2><p>布局确定后，首页每项任务下的链接将直接指向它需要的 PDF、讲义、网页文章或笔记。</p></section><p class="footer">当前仅为页面样例，未上传真实阅读材料。</p></main>
<script>
const names={reading:'阅读材料',outline:'阅读提纲',problem:'作业题目',lab:'实验说明',notes:'课堂讲义'};
const key=new URLSearchParams(location.search).get('type');
const title=names[key]||names.reading;
document.getElementById('title').textContent=title;
document.title=title+' · worklist';
</script>
